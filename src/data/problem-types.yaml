# UHS Honors Geometry 2026–27: problem-type catalog (machine-readable)
# Load with yaml.safe_load. Every type lists where it was seen (decks / homework / assessments).

meta:
  title: 'UHS Honors Geometry 2026–27: problem-type catalog (machine-readable)'
  version: '2026-11-20'
  purpose: Every problem type seen in the lesson decks, homework and assessments, with where it appears. Use it to write new
    problems, balance assessments, and check coverage.
  companions:
  - claude/course_topics.yaml (what is taught)
  - claude/style_guide.yaml (how it looks)
  - claude/assessment-style-guide.md (item-writing detail)
  id_scheme: 'FAMILY.NAME. Families: PRF proof, CRIT criteria, ANG angles, ALG algebra fold-in, QUAD quadrilaterals, TRF transformations,
    CON constructions, LOC locus, DIL dilations, SIM similarity, PYTH Pythagorean, SRT special right triangles, TRIG right-triangle
    trig, POLY polygons/π, RAD/UC radians and unit circle, OBL oblique triangles, TASK classroom routines.'
  seen_in_keys:
    decks: lesson code + slide title (Beamer/PPTX)
    homework: IM practice problems (solution decks) and the Congruence Proof Packet
    assessments: item numbers; status given unless marked “built, not given”
  rules:
  - Teacher Guide is the starting point; teacher decides.
  - Algebra and trig are folded into geometry problems, not separate drills.
  - Trapezoid is exclusive; isosceles trapezoid = congruent legs; kite is inclusive.
  - Geometric mean is an honors extension.
  - 'Whiteboard problems: markers only.'
  - Use only results proven by that point in the unit.
