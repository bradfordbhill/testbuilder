types:
- id: PRF.TRI_CONG
  name: Prove two triangles congruent, then use CPCTC
  family: proof
  units:
  - 2
  task: From stated givens and a marked figure, prove a triangle congruence by SAS, ASA, AAS, SSS or HL; part (b) asks what
    else must be true (CPCTC).
  formats:
  - two_column_proof
  - paragraph_proof
  - any_format
  answer_format: Proof with a reason for every claim; part (b) names the congruent part and cites CPCTC.
  figure: Two triangles sharing a side or vertex, or crossing segments (vertical angles); tick/arc/parallel marks match givens
    only.
  misconceptions_distractors:
  - Using SSA or AAA as a criterion
  - Wrong correspondence order in the congruence statement
  - Circular reasoning (using CPCTC before the congruence)
  - Forgetting the reflexive side or vertical angles as a reason
  scoring: 'Exams: 6 pts (Unit 2), 1–4 holistic or 1–8 (Final proof).'
  seen_in:
    decks:
    - 2B.06 Ex2 (midpoint of both segments)
    - 2B.06 Ex3 (bisected angle + shared side)
    - 2B.07 Ex2–4
    - 2B.09 Ex2
    - 2B.10 Ex4–7
    - 2C.14 Ex2
    homework:
    - IM practice 2B.6–2B.11
    - 'Congruence Proof Packet: Proof'
    assessments:
    - 'Unit 2 Exam A #7 (parallelogram KLMN ⇒ △KNL≅△MLN) [6 pts]'
    - Unit 2 Exam B parallel item
    - Unit 2 Exam C
- id: PRF.OVERLAP
  name: 'Overlapping triangles: pull them apart'
  family: proof
  units:
  - 2
  task: Two triangles share part of a side or angle; students redraw them separately, mark shared parts, and prove a congruence
    or part equality.
  formats:
  - two_column_proof
  - paragraph_proof
  answer_format: Separated sketch plus proof.
  figure: Overlapping triangles; color or separate redraw recommended.
  seen_in:
    decks:
    - 2B.10 Ex4 Overlapping Triangles
    - 2C.13 Pull the Overlapping Triangles Apart
    - 2C.13 Ex5 Diagonals of an Isosceles Trapezoid
    homework:
    - 'Proof Packet: Proof'
- id: PRF.QUAD_PROPERTY
  name: Prove a property of a special quadrilateral
  family: proof
  units:
  - 2
  task: 'Starting from a definition (parallelogram, rectangle, rhombus, kite, isosceles trapezoid), prove a property: opposite
    sides congruent, opposite angles congruent, diagonals bisect each other, rectangle diagonals congruent, rhombus diagonals
    perpendicular, kite diagonal bisects angles.'
  formats:
  - two_column_proof
  - paragraph_proof
  - any_format
  answer_format: Proof using a diagonal to form congruent triangles.
  misconceptions_distractors:
  - Assuming the property being proved (e.g., using “diagonals bisect” to prove diagonals bisect)
  - Using a property of a rectangle for a general parallelogram
  seen_in:
    decks:
    - 2B.07 Ex2 Opposite Sides of a Parallelogram
    - 2B.09 Ex3 Opposite Angles
    - 2B.09 Ex4 Kites
    - 2C.12 Ex1, Ex3, Ex6
    - '2C.13 Proof: The Diagonals of a Parallelogram'
    - 2C.14 Ex7 The Rhombus
    - 2D.15 Ex7
    homework:
    - IM practice 2C.12–2C.14
    - 'Proof Packet: Proof, Challenge'
    assessments:
    - Semester 1 Final C (PQRS parallelogram ⇒ ∠P≅∠R) — built, not given
  notes: Trapezoid is exclusive; isosceles trapezoid means congruent legs; kite is inclusive (rhombus is a kite).
- id: PRF.PROVE_PARALLELOGRAM
  name: Prove a quadrilateral is a parallelogram (converse direction)
  family: proof
  units:
  - 2
  task: Given diagonals that bisect each other, or one pair of sides both parallel and congruent, or both pairs of opposite
    sides congruent, prove the quadrilateral is a parallelogram (show both pairs of opposite sides parallel via alternate
    interior angles).
  formats:
  - two_column_proof
  - paragraph_proof
  - fill_in_proof
  - any_format
  answer_format: Proof ending with the definition of parallelogram.
  misconceptions_distractors:
  - Concluding parallel from congruent sides alone
  - Citing “alternate interior angles congruent” in the wrong direction (theorem vs converse)
  seen_in:
    decks:
    - 2C.13 Ex1 The Converse
    - 2C.13 Ex4 One Pair Is Enough
    - 2C.13 Honors Build It from Two Segments
    - 2D.15 Ex6 Congruent and Parallel (fill in)
    homework:
    - IM practice 2C.13
    - 'Proof Packet: Converse, Proof'
    assessments:
    - 'Unit 2 Exam A #8 / B #9 (fill in the reasons, 8 statements) [1 pt each]'
    - Semester 1 Final A (diagonals bisect ⇒ parallelogram), B (WX∥ZY and WX≅ZY), D (JKLM diagonals bisect) — built, not given
- id: PRF.PARALLEL_VIA_CONG
  name: Prove lines parallel using congruent triangles
  family: proof
  units:
  - 2
  task: 'Given segment congruences at an intersection point, prove two lines parallel: congruent triangles (SAS with vertical
    angles) give congruent alternate interior angles.'
  formats:
  - two_column_proof
  - paragraph_proof
  answer_format: Proof ending with the converse of the alternate interior angles theorem.
  seen_in:
    assessments:
    - 'Unit 2 Exam A #1 (AE≅EB, CE≅ED ⇒ AC∥BD) [6 pts]'
    - Unit 2 Exam B parallel item
    - Unit 2 Exam C
- id: PRF.ISOSCELES_PERPBIS
  name: Isosceles triangle and perpendicular bisector theorems and converses
  family: proof
  units:
  - 2
  task: Prove or use the isosceles triangle theorem (base angles), its converse, the perpendicular bisector theorem (equidistant
    points) and its converse; the proofs use an auxiliary line (angle bisector, midpoint, or reflection).
  formats:
  - two_column_proof
  - paragraph_proof
  - short_justification
  answer_format: Proof with the auxiliary line justified.
  misconceptions_distractors:
  - Drawing an auxiliary line with two properties at once (“the bisector that is also the perpendicular bisector”)
  seen_in:
    decks:
    - 2B.06 Auxiliary Lines and the Isosceles Triangle Theorem
    - '2B.08 Proof of the Theorem (SAS), Another Proof: Reflection, Proof of the Converse'
    - 2B.10 Ex2 Equilateral ⇒ equiangular
    - 2B.10 Ex6 Converse of the Isosceles Triangle Theorem
    homework:
    - IM practice 2B.8, 2B.10
    - Proof Packet
- id: PRF.WHY_CONSTRUCTION
  name: Why does this construction work?
  family: proof
  units:
  - 1
  - 2
  task: Explain with congruent triangles why a compass-and-straightedge construction works (angle bisector, copying an angle,
    perpendicular bisector, parallel line).
  formats:
  - paragraph_proof
  - short_justification
  answer_format: Identify the congruent triangles the arcs create and the criterion (usually SSS), then CPCTC.
  seen_in:
    decks:
    - 2B.09 Ex6 Why the Bisector Construction Works
    - 2C.14 Warm-Up
    - 2C.14 Ex3 Why Copying an Angle Works
    homework:
    - IM practice 2B.9, 2C.14
    - 'Proof Packet: Explain'
- id: PRF.SYMMETRY_MIRROR
  name: Is this line a mirror? (symmetry proofs)
  family: proof
  units:
  - 2
  task: Decide whether a diagonal or angle bisector is a line of symmetry of a figure and prove it (reflection takes the figure
    onto itself, via congruent triangles or perpendicular-bisector reasoning).
  formats:
  - decide_and_justify
  - paragraph_proof
  answer_format: Yes/no plus proof or counterexample.
  seen_in:
    decks:
    - 2C.14 Ex4 Is the Bisector a Mirror?
    - 2C.14 Ex6 Which Diagonals Are Mirrors
    - 2C.14 Honors When Is a Diagonal a Mirror?
    - 2D.15 Ex4 Symmetry Sort
    - 2D.15 Ex5 Rhombus Symmetry (fill in)
    homework:
    - IM practice 2C.14, 2D.15
    - 'Proof Packet: Decide'
- id: PRF.QUAD_CONGRUENCE
  name: Congruence criteria for parallelograms
  family: proof
  units:
  - 2
  task: 'Invent and prove criteria that guarantee two parallelograms (or quadrilaterals) are congruent: SAS parallelogram
    congruence, SSA for parallelograms, “make your own”; decide when quadrilaterals are floppy.'
  formats:
  - paragraph_proof
  - decide_and_justify
  - counterexample
  answer_format: Proof that the fourth vertex is forced, or a counterexample.
  seen_in:
    decks:
    - 2D.15 Ex1 Floppy Quadrilaterals
    - 2D.15 SAS Parallelogram Congruence + Why It Works
    - 2D.15 Ex2 Make Your Own Congruence Theorem
    - 2D.15 Ex3 Prove SSA Parallelogram Congruence
    - 2D.15 Honors Beyond Parallelograms
    homework:
    - IM practice 2D.15
- id: PRF.SIMILARITY
  name: Prove triangles (or figures) similar
  family: proof
  units:
  - 3
  task: Prove two triangles similar by AA, SAS~ or SSS~ (often from parallel lines or a shared angle), or prove a general
    similarity claim (any two squares / circles / regular n-gons are similar) with a dilation plus rigid motions.
  formats:
  - paragraph_proof
  - two_column_proof
  - prove_or_disprove
  answer_format: Proof naming the criterion or the similarity transformation.
  misconceptions_distractors:
  - Using SSA~
  - Mismatched correspondence after a turned-around triangle
  seen_in:
    decks:
    - 3B.08 Ex3 Prove or Disprove
    - '3B.08 Always Similar: Circles and Regular Polygons'
    - 3B.09 AA Similarity and Why
    - 3B.10 SAS and SSS Similarity, and Why They Work
    homework:
    - IM practice 3B.6–3B.10
    assessments:
    - 'Unit 3 Exams A/B #25–27 (paragraph proofs: AB∥DE with crossing segments; DE∥BC in a triangle; altitude to hypotenuse)
      — built, not given (12/3)'
    - 'Unit 3 study guide #23–24'
    - Semester 1 Final u3pf proof-justification set — built, not given
- id: PRF.DILATION_THEOREM
  name: Prove a dilation or proportionality theorem
  family: proof
  units:
  - 3
  task: 'Prove: a dilation takes a line not through the center to a parallel line (synthetic and coordinate proofs); the triangle
    midsegment theorem; the triangle proportionality theorem and its converse; angle bisector theorem (honors).'
  formats:
  - paragraph_proof
  - paragraph_proof
  answer_format: Proof by dilation from a vertex, or by similar triangles.
  seen_in:
    decks:
    - '3A.04 Proof in Parallel, Another Proof: Coordinates, Angles Keep Their Measure'
    - 3A.05 Dilating From a Vertex, Convince a Skeptic
    - 3B.11 A Parallel Line Divides the Sides Proportionally, The Converse
    - 3B.11 Honors Angle Bisector Theorem
    homework:
    - IM practice 3A.4–3A.5, 3B.11
- id: PRF.FORMULA_DERIVATION
  name: Prove a formula or identity
  family: proof
  units:
  - 3
  - 4
  task: 'Derive a central result: Pythagorean theorem (area two ways; similar triangles), its converse, sine/cosine of complements,
    the Pythagorean identity and tan = sin/cos, the SAS area formula, the Law of Sines, the Law of Cosines, Heron’s formula,
    the n-gon perimeter formula.'
  formats:
  - guided_derivation
  - error_analysis
  - paragraph_proof
  answer_format: Chain of equalities with each step justified.
  honors_extension: Parallelogram law (4D.19), two more identities (4D.15), Archimedes’ doubling trick (4C.12).
  seen_in:
    decks:
    - '3C.14 Warm-Up Area Two Ways (Proof 1), Proof 2: Similar Triangles, Check the Proof'
