  - name: Exam 1B Transformations A
    status: given
    source: item types via assessment-style-guide.md
  - name: Exam 1C–1D A
    status: given
    source: item types via assessment-style-guide.md
  - name: Exam 2A.1 – 2B.8 Congruent Figures A and B (Unit 2 Exam)
    status: given; returned 2026-11
    source: teacher uploads
  - name: Unit 2 Exam C (alternate retake) + Test Corrections form
    status: built for retakes
  - name: Mini Quiz 3A–3B
    status: scheduled 2026-11-18; source not in project
  - name: Unit 3 Exams A/B and study guide
    status: built, not given (exam 2026-12-03)
  - name: Semester 1 Final A–D
    status: built, not given (2026-12-14/15)
response_formats:
  mc_single: 4 options a–d; one defensible answer; misconception distractors.
  select_all: 5–6 options a–f; “Select all” with all underlined.
  true_false: 'Written as MC: a. True / b. False.'
  always_sometimes_never: A/S/N, often with a one-sentence justification [2 pts].
  must_could_cant: Must be / could be / can’t be true; must vs might.
  matching: Letters to numbers (A–3); IM practice.
  shared_stem_group: Italic range tag “(#5–8) …”, items refer back.
  shared_answer_bank: One list of choices (e.g., SSS/SAS/ASA/None) for several items.
  numeric_answer: “x = ___”, boxed; exact and/or decimal as stated.
  answer_pair_blanks: '“Answer: ___ and ___”.'
  short_justification: “Briefly explain” + 3–5 writing lines.
  decide_and_justify: Yes/no or choice, then a reason or counterexample.
  fill_blank_statement: Complete a theorem/criterion sentence.
  fill_in_proof: Blanks in statements or reasons of a given proof.
  two_column_proof: Statement | Reason table.
  paragraph_proof: Prose proof with a reason for every claim.
  any_format: Student chooses two-column, paragraph or flow (Final).
  error_analysis: Find and fix the mistake in named student work; “Do you agree with X?”.
  construction: Compass and straightedge; arcs visible.
  draw_on_diagram: Draw/label image, line, center or symmetry on the given figure or grid.
  image_table: Original | Image two-column table.
  information_gap: Problem card / data card pairs.
  card_sort: Sort or match cards.
  open_task: BTC whiteboard thinking task.
  short_answer: A name, statement or expression on a blank.
  counterexample: One labeled sketch or numeric example that breaks the claim.
  prove_or_disprove: Decide, then prove or give a counterexample.
  count_cases: How many (0, 1, 2) triangles/points; justify.
  guided_derivation: Scaffolded derivation of a formula, step by step.
  proof_plan: Work-backward plan before writing the proof.
  ordering: Arrange scrambled proof steps.
  notice_wonder: Notice and wonder launch.
  which_three: Which three go together? (four items, many right answers).
  mixed: Mixed formats.
  sketch: Freehand sketch, “go over in class” in solution decks.
scoring_conventions:
  mc: 1 pt each on mixed exams (Final); no per-item points on all-MC exams.
  free_response: 4 pts basic FR; 2 pts T/F and A/S/N; 6–8 pts proofs (Unit 2); 1–4 holistic per FR on the Final.
  proof_final: 1–8 scale.
  extra_credit: +2 pts, bold, honors-level.
