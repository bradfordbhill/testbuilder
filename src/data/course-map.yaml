  detail_level: "titles (+ theorem bank)"
  status: "taught and assessed (Unit 2 Exams A, B; retake Exam C; Mini Quiz 2A.1-2A.4)"
  built: ["decks 2B.6-2D.15", "Unit 2 Theorem Bank (+ print)", "Congruence Proof Packet", "Unit 2 practice-problem solutions", "Exam C + key", "Test Corrections form"]
  sections:
    A: {title: "Congruent Figures", lessons: "1-5"}
    B: {title: "Triangle Congruence Theorems", lessons: "6-11"}
    C: {title: "Proofs about Quadrilaterals", lessons: "12-14"}
    D: {title: "Let's Put It to Work", lessons: "15"}
  lessons:
  - {code: 2A.1, title: "Congruent Parts, Part 1", topics: ["congruent (sequence of rigid motions)", "corresponding parts", "congruence statements", "CPCTC"]}
  - {code: 2A.2, title: "Congruent Parts, Part 2", topics: ["corresponding parts from rigid motions"]}
  - {code: 2A.3, title: "Congruent Triangles, Part 1", topics: ["correspondence of vertices", "writing congruence statements"]}
  - {code: 2A.4, title: "Congruent Triangles, Part 2", topics: ["isosceles triangle base angles", "line of symmetry of isosceles triangle"]}
  - {code: 2A.5, title: "Points, Segments, and Zigzags", topics: ["auxiliary lines", "proving segments/angles congruent with rigid motions"]}
  - {code: 2B.6, title: "Side-Angle-Side Triangle Congruence", topics: ["SAS criterion", "included angle"]}
  - {code: 2B.7, title: "Angle-Side-Angle Triangle Congruence", topics: ["ASA criterion", "included side"]}
  - {code: 2B.8, title: "The Perpendicular Bisector Theorem", topics: ["Perpendicular Bisector Theorem and converse", "converse", "equidistant"]}
  - {code: 2B.9, title: "Side-Side-Side Triangle Congruence", topics: ["SSS criterion", "a segment is congruent to itself"]}
  - {code: 2B.10, title: "Practicing Proofs", topics: ["two-column and paragraph proofs", "choosing criteria"]}
  - {code: 2B.11, title: "Side-Side-Angle (Sometimes) Congruence", optional: true, topics: ["SSA not a criterion", "AAA not a criterion", "the swinging-side picture"]}
  - {code: 2C.12, title: "Proofs about Quadrilaterals", topics: ["kite", "isosceles trapezoid", "proving properties with congruent triangles"]}
  - {code: 2C.13, title: "Proofs about Parallelograms", topics: ["parallelogram definition", "opposite sides congruent", "opposite angles congruent", "consecutive angles supplementary", "diagonals bisect each other"]}
  - {code: 2C.14, title: "Bisect It", topics: ["proving a quadrilateral is a parallelogram (diagonals bisect each other, one pair of sides parallel and congruent, both pairs of opposite sides congruent)", "rectangle and rhombus diagonal properties"]}
  - {code: 2D.15, title: "Congruence for Quadrilaterals", topics: ["quadrilateral congruence criteria", "SSSS fails"]}
  quadrilateral_properties:
    parallelogram: "opposite sides congruent; opposite angles congruent; consecutive angles supplementary; diagonals bisect each other; 180-deg rotational symmetry"
    rectangle: "all parallelogram properties; diagonals congruent; four right angles"
    rhombus: "all parallelogram properties; diagonals perpendicular; each diagonal bisects two angles and is a line of symmetry"
    square: "every property of a rectangle and of a rhombus"
    kite: "two pairs of congruent adjacent sides; the diagonal through the vertex angles is the perpendicular bisector of the other diagonal and bisects two angles; diagonals perpendicular"
    isosceles_trapezoid: "exactly one pair of parallel sides; legs congruent; base angles congruent; diagonals congruent"
    proving_special: "rectangle: parallelogram with a right angle or congruent diagonals; rhombus: four congruent sides or diagonals that bisect each other and are perpendicular; square: rectangle that is a rhombus"
  algebra_folded_in: ["base-angle equations in isosceles triangles", "opposite/consecutive angle equations in parallelograms", "side-expression equations (must it be a rhombus?)", "diagonal-segment equations"]
  wishlist: "2C quadrilateral hierarchy rewrite: info slide per shape (sides, angles, diagonals, symmetry), exclusive trapezoid, 'diagonals only' reasoning examples."

# ===================================================================== UNIT 3
- unit: 3
  title: "Similarity"
  detail_level: "full (claude/unit3/U3_vocab.md)"
  status: "in progress (3A taught; 3B.6-3B.9 taught by 11/18; pacing to 3D.17 by 12/1; Unit 3 Exam 12/3)"
  built: ["decks 3A.1-3D.17", "Unit 3 Theorem Bank", "Unit 3 practice-problem solutions", "Unit 3 Study Guide + Exams A/B + keys", "Unit 3 Summary (skills, glossary, recap)", "Similar Figures worksheet"]
  sections:
    A: {title: "Properties of Dilations", lessons: "1-5"}
    B: {title: "Similarity Transformations and Proportional Reasoning", lessons: "6-12"}
    C: {title: "Similarity in Right Triangles", lessons: "13-16"}
    D: {title: "Let's Put It to Work", lessons: "17"}
  lessons:
  - code: 3A.1
    title: "Scale Drawings"
    new_terms: ["scale drawing", "scale factor", "dilation", "center of dilation"]
    skills: ["dilate a point: A' on ray PA with PA' = k*PA", "scale drawings: every length times k"]
  - code: 3A.2
    title: "Scale of the Solar System"
    optional: true
    new_terms: ["scaled copy"]
    skills: ["choose a scale factor", "corresponding parts"]
  - code: 3A.3
    title: "Measuring Dilations"
    new_terms: ["ratio (as a quotient)", "same proportion"]
    skills: ["find center and scale factor from figure and image", "k = PA'/PA = A'B'/AB"]
  - code: 3A.4
    title: "Dilating Lines and Angles"
    new_terms: ["corresponding angles under a dilation are congruent"]
    theorems: ["a dilation takes a line not through the center to a parallel line; a line through the center to itself"]
  - code: 3A.5
    title: "Splitting Triangle Sides with Dilation, Part 1"
    new_terms: ["divides sides proportionally"]
    theorems: ["a line dividing two sides of a triangle proportionally is parallel to the third side", "midpoint segment is parallel to the third side and half as long"]
  - code: 3B.6
    title: "Connecting Similarity and Transformations"
    new_terms: ["similar (rigid motions + dilations)", "similarity statement"]
    skills: ["describe a similarity sequence", "write similarity statements with matching vertex order"]
  - code: 3B.7
    title: "Reasoning about Similarity with Transformations"
    new_terms: ["corresponding side lengths in the same proportion"]
    theorems: ["Similar triangles theorem: all corresponding angles congruent and all corresponding sides proportional => similar"]
  - code: 3B.8
    title: "Are They All Similar?"
    new_terms: ["all circles are similar", "counterexample"]
    skills: ["prove all circles / squares / equilateral triangles similar; counterexample for rectangles, rhombuses, isosceles triangles"]
  - code: 3B.9
    title: "Conditions for Triangle Similarity"
    theorems: ["Angle-Angle Triangle Similarity Theorem (proof: dilate, then ASA)"]
    skills: ["find two pairs of congruent angles (vertical, parallel lines, shared, right angles)", "set up proportions"]
  - code: 3B.10
    title: "Other Conditions for Triangle Similarity"
    optional: true
    theorems: ["Side-Angle-Side Triangle Similarity Theorem", "Side-Side-Side Triangle Similarity Theorem"]
  - code: 3B.11
    title: "Splitting Triangle Sides with Dilation, Part 2"
    theorems: ["a line parallel to one side of a triangle divides the other two sides proportionally (and makes a similar triangle)"]
  - code: 3B.12
    title: "Practice with Proportional Relationships"
    optional: true
    new_terms: ["equivalent ratios", "ratios between triangles", "ratios within a triangle"]
    honors: ["geometric mean sqrt(ab) (honors extension, kept by teacher)"]
  - code: 3C.13
    title: "Using the Pythagorean Theorem and Similarity"
    new_terms: ["altitude", "altitude to the hypotenuse"]
    theorems: ["altitude to the hypotenuse makes three similar right triangles"]
    honors: ["h^2 = xy, leg^2 = segment * hypotenuse (geometric mean)"]
  - code: 3C.14
    title: "Proving the Pythagorean Theorem"
    theorems: ["Pythagorean Theorem a^2 + b^2 = c^2 (similarity proof)"]
    skills: ["missing side", "exact simplest radical form"]
  - code: 3C.15
    title: "Converse of the Pythagorean Theorem"
    new_terms: ["Triangle Inequality"]
    theorems: ["Converse of the Pythagorean Theorem", "acute/right/obtuse test by comparing c^2 with a^2 + b^2"]
  - code: 3C.16
    title: "Finding All the Unknown Values in Triangles"
    skills: ["use a ratio table for similar right triangles (ratios within); solve all sides and angles"]
  - code: 3D.17
    title: "Reflecting Similarity"
    new_terms: ["incidence angle", "reflection angle", "normal"]
    skills: ["mirror method h/eye height = (mirror to object)/(you to mirror)", "shadow problems", "bank shots"]
  algebra_folded_in: ["proportions", "midsegment equations", "exact radicals; planned later: quadratics in Unit 3 problems (wishlist)"]

