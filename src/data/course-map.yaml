# UHS Honors Geometry 2026-27: course topic map (machine-readable)
# Purpose: one file another Claude session (or tool) can load to know every topic, term, theorem and skill
#   in the course, which lesson introduces it, and what has been taught or built so far.
# Sources: Imagine IM Geometry Teacher Guides (Units 1-8, lesson titles and sections), project canonical files
#   (claude/unit3/U3_vocab.md, claude/unit4/U4_canonical.*, claude/unit4/U4D_canonical.*), theorem banks,
#   decks, assessments, claude/course-reference.md, claude/style-guide.md, claude/handoff.md.
# Generated 2026-11-20.
#
# Conventions:
#   code: Unit + Section + "." + lesson number, lesson numbers continuous within a unit (4A.1, 4D.13).
#         Shown unpadded everywhere; zero-padded only in filenames (4A.01_...).
#   optional: true = optional in the TG. The 2026-27 pacing skips the optional lessons 3B.10, 3B.12, 4A.2, 4A.3.
#   source: TG = Teacher Guide lesson; teacher-addition = added by the teacher (not in the TG).
#   status: taught | planned (dated pacing exists) | not-yet (no date) ; built = materials that exist.
#   new_terms / theorems / skills: what the lesson introduces. "(review)" items are prerequisites, listed in prereq.
#   honors: extensions beyond the TG that the teacher approved (keep, label as honors).
#   detail_level: full = from a project canonical/vocab file; titles = from the TG table of contents only
#                 (topics inferred from the lesson title; verify against the TG before building).

course:
  name: UHS Honors Geometry
  year: 2026-27
  curriculum: Imagine IM (Illustrative Mathematics) Geometry, 8 units
  schedule: "Mon/Tue 100-min blocks (Mon P1/P3/P5, Tue P2/P4/P6), usually 2 lessons; Wed-Fri 50 min, 1 lesson; Wednesdays early release"
  north_star: "Vertical integration: Algebra I (before) -> College Algebra or AP Precalculus (after). Algebra and trig are folded into geometry problems, never separate slides."
  proof_emphasis: "Formal definitions and proof are central; Five Rules of Proof handout."
  progress_as_of_2026-11-20: "Taught through 3B.9/3B.11 (pacing: 3C.13 on 11/20). Unit 3 Exam 12/3; Semester 1 Final 12/14-15 covers Units 1-3 + 4A."

notation_and_language:
  - "Lines named with script letters (l, m, u); vectors with arrows; images with primes P', P'', P'''."
  - "Segment AB with overline, line with double arrow, ray with single arrow; triangle and angle symbols; congruent, parallel, perpendicular symbols."
  - "Teacher definitions used verbatim (see course-reference.md): circle, midpoint (no 'middle'), bisect, reflection (no 'flip/mirror image'), rotation, translation, symmetry, congruence."
  - "Criteria phrased: 'If there is a correspondence between two triangles so that ___ are congruent, then the triangles are congruent.'"
  - "Reason wording: 'Corresponding parts of congruent triangles are congruent' (CPCTC acceptable), 'Angle-Angle Triangle Similarity Theorem' (AA)."
  - "Trapezoid is EXCLUSIVE (exactly one pair of parallel sides). Isosceles trapezoid = trapezoid with congruent legs. Kite is inclusive (a rhombus is a kite)."
  - "Unit 4 TG order of ratios: cos, sin, tan; no SOHCAHTOA in the TG."

units:

